spring.application.name=dev-springboot-postgres-pokemon

# --- Seguridad -------------------------------------------------------------
# Los secretos NO tienen valor por defecto: la app no arranca si faltan.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:dev-springboot-postgres-pokemon}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}

app.security.users[0].username=${APP_ADMIN_USERNAME:admin}
app.security.users[0].password=${APP_ADMIN_PASSWORD}
app.security.users[0].roles=ADMIN

# No exponer detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
